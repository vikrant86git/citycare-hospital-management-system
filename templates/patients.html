<!DOCTYPE html>
<html>
<head>
    <title>Patients - CityCare Hospital</title>
</head>
<body>

    <h1>Patient List</h1>

    <form method="GET">
        <input
            type="text"
            name="search"
            placeholder="Search patient by name"
            value="{{ search_query }}"
        >

        <button type="submit">Search</button>

        <a href="{% url 'patient_list' %}">Show All</a>
    </form>

    <br>

    {% for patient in patients %}

        <div>
            <h2>{{ patient.name }}</h2>
            <p>Age: {{ patient.age }}</p>
            <p>Gender: {{ patient.gender }}</p>
            <p>Phone: {{ patient.phone }}</p>
            <p>Email: {{ patient.email }}</p>
        </div>

        <hr>

    {% empty %}

        <p>No patients found.</p>

    {% endfor %}

    <a href="/">Back to Home</a>

</body>
</html>
